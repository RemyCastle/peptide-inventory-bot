name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: |
          python -m compileall -q -x 'venv|__pycache__' .
          ruff check \
            pricing_rules.py sku_normalizer.py reorder_predictor.py carrier_detect.py \
            tests/test_pricing_rules.py tests/test_sku_normalizer.py \
            tests/test_reorder_predictor.py tests/test_carrier_detect.py \
            tests/test_admin_allowlist.py
      - name: Test
        run: python -m unittest discover -s tests -q
