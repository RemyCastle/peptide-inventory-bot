# UnicornFartzzBot on your existing Render account (separate from TyFit).
# Web service keeps a public health URL; bot long-polls Telegram inside the same process.
# Starter ≈ always-on (same tier idea as TyFit). Free sleeps after inactivity.
services:
  - type: web
    name: unicornfartzz-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional: BOT_TOKENS=token_a,token_b  TOKEN_FAILOVER=1
      - key: OWNER_IDS
        sync: false
      - key: BRAND_NAME
        value: UnicornFartzzBot
      - key: DB_PATH
        value: /data/inventory.db
      - key: LOG_PATH
        value: /data/bot.log
      - key: BACKUP_DIR
        value: /data/backups
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: TOKEN_STATE_PATH
        value: /data/token_state.json
      # Set in dashboard (secret): BACKUP_PASSPHRASE, optional BOT_TOKENS
      - key: BACKUP_PASSPHRASE
        sync: false
      # ── SPBC website integration (supplier notify + catalog sync) ──
      # Shared secret with the spbc-orders Cloudflare worker (X-Notify-Secret)
      - key: NOTIFY_SECRET
        sync: false
      - key: OWNER_TELEGRAM_CHAT_ID
        sync: false
      - key: SUPPLIER_TELEGRAM_CHAT_ID
        sync: false
      - key: SPBC_SITE_URL
        value: https://springfieldpbc.com
      # Bot shop chat id that mirrors the website catalog (unset = sync off)
      - key: SPBC_SHOP_CHAT_ID
        sync: false
      - key: SITE_SYNC_INTERVAL_MIN
        value: "360"
      # Public URL of THIS service — enables /webpanel vendor console links
      - key: PANEL_BASE_URL
        sync: false
    disk:
      name: unicornfartzz-data
      mountPath: /data
      sizeGB: 1
