# SPBC Inventory Bot — the central order/inventory brain for all vendors.
# Web service keeps a public health URL (storefront API + vendor panel); the
# SPBC bot and every vendor's branded store bot long-poll inside this process.
# Starter ≈ always-on. Free tier is NOT viable here: no persistent disk = no DB.
services:
  - type: web
    name: spbc-inventory-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional: BOT_TOKENS=token_a,token_b  TOKEN_FAILOVER=1
      - key: OWNER_IDS
        sync: false
      - key: BRAND_NAME
        value: SPBC Order Bot
      # Vendor mini-app store bots — one JSON entry per vendor (vendor_stores.py)
      - key: VENDOR_STORES_JSON
        sync: false
      - key: DB_PATH
        value: /data/inventory.db
      - key: LOG_PATH
        value: /data/bot.log
      - key: BACKUP_DIR
        value: /data/backups
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: TOKEN_STATE_PATH
        value: /data/token_state.json
      # Set in dashboard (secret): BACKUP_PASSPHRASE, optional BOT_TOKENS
      - key: BACKUP_PASSPHRASE
        sync: false
      # ── SPBC website integration (supplier notify + catalog sync) ──
      # Shared secret with the spbc-orders Cloudflare worker (X-Notify-Secret)
      - key: NOTIFY_SECRET
        sync: false
      - key: OWNER_TELEGRAM_CHAT_ID
        sync: false
      - key: SUPPLIER_TELEGRAM_CHAT_ID
        sync: false
      - key: SPBC_SITE_URL
        value: https://springfieldpbc.com
      # Bot shop chat id that mirrors the website catalog (unset = sync off)
      - key: SPBC_SHOP_CHAT_ID
        sync: false
      - key: SITE_SYNC_INTERVAL_MIN
        value: "360"
      # Public URL of THIS service — enables /webpanel vendor console links
      # and the photo/COA uploads served from /media
      - key: PANEL_BASE_URL
        sync: false
      - key: MEDIA_DIR
        value: /data/uploads
    disk:
      name: unicornfartzz-data
      mountPath: /data
      sizeGB: 1
